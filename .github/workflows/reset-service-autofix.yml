name: Reset service source autofix

on:
  push:
    branches: [feature/seven-day-project-you-reset-v1]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[reset-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/seven-day-project-you-reset-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply narrow TypeScript fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/reset/service.ts')
          s=p.read_text()
          s=s.replace('const closures = await loadClosures(supabase, enrollment.id);\n  await supabase.from("reset_enrollments").update({\n    closed_day_count: closures.length,\n    completed_day_count: closures.filter((row) => Number(row.completion_percentage ?? 0) >= 100).length,', 'const closures: ClosureRow[] = await loadClosures(supabase, enrollment.id);\n  await supabase.from("reset_enrollments").update({\n    closed_day_count: closures.length,\n    completed_day_count: closures.filter((row: ClosureRow) => Number(row.completion_percentage ?? 0) >= 100).length,')
          s=s.replace('if (!candidate) return null;\n  const task = (await supabase.from("tasks").select("id,due_at,title").eq("id", candidate.sourceId).maybeSingle()).data;', 'if (!candidate?.sourceId) return null;\n  const candidateSourceId = candidate.sourceId;\n  const task = (await supabase.from("tasks").select("id,due_at,title").eq("id", candidateSourceId).maybeSingle()).data;')
          s=s.replace('relatedEntities: [{ type: "task", id: candidate.sourceId, label: candidate.title }],\n    source: "coach", sourceAgent: "coach", dedupeKey: `reset:${enrollment.id}:day5-adjustment`, actionType: "task.reschedule", actionPayload: { taskId: candidate.sourceId, dueAt, resetEnrollmentId: enrollment.id },', 'relatedEntities: [{ type: "task", id: candidateSourceId, label: candidate.title }],\n    source: "coach", sourceAgent: "coach", dedupeKey: `reset:${enrollment.id}:day5-adjustment`, actionType: "task.reschedule", actionPayload: { taskId: candidateSourceId, dueAt, resetEnrollmentId: enrollment.id },')
          s=s.replace('const [{ data: snapshots }, closures] = await Promise.all([supabase.from("reset_daily_snapshots").select("planned_actions").eq("enrollment_id", enrollment.id), loadClosures(supabase, enrollment.id)]);\n  const planned = (snapshots ?? []).flatMap((row: any) => asPlanned(row.planned_actions));\n  const eligible = closures.flatMap((row) => row.eligible_actions ?? []);', 'const { data: snapshots } = await supabase.from("reset_daily_snapshots").select("planned_actions").eq("enrollment_id", enrollment.id);\n  const closures: ClosureRow[] = await loadClosures(supabase, enrollment.id);\n  const planned: PlannedResetAction[] = (snapshots ?? []).flatMap((row: any) => asPlanned(row.planned_actions));\n  const eligible: any[] = closures.flatMap((row: ClosureRow) => row.eligible_actions ?? []);')
          s=s.replace('const financeActionsCompleted = planned.filter((action) => action.sourceType === "finance" && completedKeys.has(action.key)).length;\n  const actionsCompleted = closures.reduce((sum, row) => sum + Number(row.completed_count ?? 0), 0);', 'const financeActionsCompleted = planned.filter((action: PlannedResetAction) => action.sourceType === "finance" && completedKeys.has(action.key)).length;\n  const actionsCompleted = closures.reduce((sum: number, row: ClosureRow) => sum + Number(row.completed_count ?? 0), 0);')
          s=s.replace('const flatActions = (snapshots ?? []).flatMap((row: any) => asPlanned(row.planned_actions).map((action) => ({ ...action, date: row.local_date })));\n    const taskPlanned = flatActions.filter((item) => ["task","finance"].includes(item.sourceType)).length;\n    const habitPlanned = flatActions.filter((item) => item.sourceType === "habit").length;\n    const workoutPlanned = flatActions.filter((item) => item.sourceType === "workout").length;\n    const eligibleRows = closures.flatMap((row) => (row.eligible_actions ?? []).map((item: any) => ({ ...item, date: row.local_date })));', 'const flatActions: Array<PlannedResetAction & { date: string }> = (snapshots ?? []).flatMap((row: any) => asPlanned(row.planned_actions).map((action: PlannedResetAction) => ({ ...action, date: String(row.local_date) })));\n    const taskPlanned = flatActions.filter((item: PlannedResetAction & { date: string }) => ["task","finance"].includes(item.sourceType)).length;\n    const habitPlanned = flatActions.filter((item: PlannedResetAction & { date: string }) => item.sourceType === "habit").length;\n    const workoutPlanned = flatActions.filter((item: PlannedResetAction & { date: string }) => item.sourceType === "workout").length;\n    const eligibleRows: any[] = closures.flatMap((row: ClosureRow) => (row.eligible_actions ?? []).map((item: any) => ({ ...item, date: row.local_date })));')
          s=s.replace('const taskKeys = new Set(flatActions.filter((item) => ["task","finance"].includes(item.sourceType)).map((item) => item.key));\n    const habitKeys = new Set(flatActions.filter((item) => item.sourceType === "habit").map((item) => item.key));\n    const workoutKeys = new Set(flatActions.filter((item) => item.sourceType === "workout").map((item) => item.key));\n    const totalEligible = closures.reduce((sum, row) => sum + Number(row.eligible_count ?? 0), 0), totalCredits = closures.reduce((sum, row) => sum + Number(row.completed_count ?? 0) + Number(row.partial_count ?? 0) * .5, 0);', 'const taskKeys = new Set(flatActions.filter((item: PlannedResetAction & { date: string }) => ["task","finance"].includes(item.sourceType)).map((item: PlannedResetAction & { date: string }) => item.key));\n    const habitKeys = new Set(flatActions.filter((item: PlannedResetAction & { date: string }) => item.sourceType === "habit").map((item: PlannedResetAction & { date: string }) => item.key));\n    const workoutKeys = new Set(flatActions.filter((item: PlannedResetAction & { date: string }) => item.sourceType === "workout").map((item: PlannedResetAction & { date: string }) => item.key));\n    const totalEligible = closures.reduce((sum: number, row: ClosureRow) => sum + Number(row.eligible_count ?? 0), 0), totalCredits = closures.reduce((sum: number, row: ClosureRow) => sum + Number(row.completed_count ?? 0) + Number(row.partial_count ?? 0) * .5, 0);')
          s=s.replace('for (const item of flatActions.filter((row) => row.sourceType === "habit"))', 'for (const item of flatActions.filter((row: PlannedResetAction & { date: string }) => row.sourceType === "habit"))')
          s=s.replace('taskCompletion: { planned: taskPlanned, completed: eligibleRows.filter((row) => taskKeys.has(row.key) && isComplete(row)).length, partial: eligibleRows.filter((row) => taskKeys.has(row.key) && ["partial","minimum"].includes(row.status)).length, rescheduled: eligibleRows.filter((row) => taskKeys.has(row.key) && row.status === "rescheduled").length, blocked: eligibleRows.filter((row) => taskKeys.has(row.key) && row.status === "blocked").length, completionPercentage:', 'taskCompletion: { planned: taskPlanned, completed: eligibleRows.filter((row: any) => taskKeys.has(row.key) && isComplete(row)).length, partial: eligibleRows.filter((row: any) => taskKeys.has(row.key) && ["partial","minimum"].includes(row.status)).length, rescheduled: eligibleRows.filter((row: any) => taskKeys.has(row.key) && row.status === "rescheduled").length, blocked: eligibleRows.filter((row: any) => taskKeys.has(row.key) && row.status === "blocked").length, completionPercentage:')
          s=s.replace('habitConsistency: { planned: habitPlanned, completed: eligibleRows.filter((row) => habitKeys.has(row.key) && isComplete(row)).length, minimumVersionsUsed: eligibleRows.filter((row) => habitKeys.has(row.key) && row.status === "minimum").length, recoveryCount:', 'habitConsistency: { planned: habitPlanned, completed: eligibleRows.filter((row: any) => habitKeys.has(row.key) && isComplete(row)).length, minimumVersionsUsed: eligibleRows.filter((row: any) => habitKeys.has(row.key) && row.status === "minimum").length, recoveryCount:')
          s=s.replace('training: { planned: workoutPlanned, completed: eligibleRows.filter((row) => workoutKeys.has(row.key) && isComplete(row)).length, totalTrainingMinutes: flatActions.filter((item) => item.sourceType === "workout" && eligibleRows.some((row) => row.key === item.key && isComplete(row))).reduce((sum, item) => sum + Number(item.durationMinutes ?? 0), 0), bodyCompositionEntries: bodyEntries },\n      finance: { actionsPlanned: flatActions.filter((item) => item.sourceType === "finance").length, actionsCompleted: eligibleRows.filter((row) => flatActions.some((item) => item.sourceType === "finance" && item.key === row.key) && isComplete(row)).length, amountMovement: null, goal:', 'training: { planned: workoutPlanned, completed: eligibleRows.filter((row: any) => workoutKeys.has(row.key) && isComplete(row)).length, totalTrainingMinutes: flatActions.filter((item: PlannedResetAction & { date: string }) => item.sourceType === "workout" && eligibleRows.some((row: any) => row.key === item.key && isComplete(row))).reduce((sum: number, item: PlannedResetAction & { date: string }) => sum + Number(item.durationMinutes ?? 0), 0), bodyCompositionEntries: bodyEntries },\n      finance: { actionsPlanned: flatActions.filter((item: PlannedResetAction & { date: string }) => item.sourceType === "finance").length, actionsCompleted: eligibleRows.filter((row: any) => flatActions.some((item: PlannedResetAction & { date: string }) => item.sourceType === "finance" && item.key === row.key) && isComplete(row)).length, amountMovement: null, goal:')
          s=s.replace('const lastClosed = closures.at(-1)?.local_date ? String(closures.at(-1).local_date) : null;', 'const lastClosure = closures.at(-1);\n  const lastClosed = lastClosure?.local_date ? String(lastClosure.local_date) : null;')
          s=s.replace('async function loadClosures(supabase: any, enrollmentId: string) {', 'async function loadClosures(supabase: any, enrollmentId: string): Promise<ClosureRow[]> {')
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code -- lib/reset/service.ts && exit 0 || true
          git config user.name "ProjectYouPlus Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/reset/service.ts
          git commit -m "Fix Reset TypeScript contracts [reset-autofix]"
          git push origin HEAD:feature/seven-day-project-you-reset-v1
