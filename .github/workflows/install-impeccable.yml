name: Install Impeccable (one-time)

on:
  push:
    paths:
      - '.github/workflows/install-impeccable.yml'

permissions:
  contents: write

jobs:
  install-impeccable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22.18
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install Impeccable for Codex in this project
        run: npx -y impeccable@4.1.0 install -y --providers=codex --scope=project

      - name: Verify installation
        run: |
          test -f .agents/skills/impeccable/SKILL.md
          test -f .codex/hooks.json
          echo "Impeccable skill and Codex hook manifest installed."
          git status --short

      - name: Commit installed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No installation changes to commit."
          else
            git commit -m "Install Impeccable for Codex"
            git push
          fi
