name: Project You+ QA Agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-you-plus-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: qa-placeholder-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      LIVE_ONBOARDING_BASE_URL: https://project-you-plus-git-feature-production-c11e96-miguelbinet-9644.vercel.app
      LIVE_ONBOARDING_EMAIL: ${{ secrets.ONBOARDING_E2E_EMAIL }}
      LIVE_ONBOARDING_PASSWORD: ${{ secrets.ONBOARDING_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Lint
        shell: bash
        run: mkdir -p qa-logs && set -o pipefail && npm run lint 2>&1 | tee qa-logs/lint.log
      - name: Unit and integration tests
        shell: bash
        run: set -o pipefail && npm test 2>&1 | tee qa-logs/tests.log
      - name: Typecheck
        shell: bash
        run: set -o pipefail && npm run typecheck 2>&1 | tee qa-logs/typecheck.log
      - name: Production build
        shell: bash
        run: set -o pipefail && npm run build 2>&1 | tee qa-logs/build.log
      - name: Browser regression
        shell: bash
        run: set -o pipefail && npm run test:e2e 2>&1 | tee qa-logs/e2e.log
      - name: Connected onboarding flow
        if: ${{ env.LIVE_ONBOARDING_EMAIL != '' && env.LIVE_ONBOARDING_PASSWORD != '' }}
        shell: bash
        run: set -o pipefail && npx playwright test tests/e2e/onboarding-live.spec.ts --project=desktop-chromium 2>&1 | tee qa-logs/live-onboarding.log
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-you-plus-qa-report
          path: |
            qa-logs/
            playwright-report/
            test-results/
          if-no-files-found: ignore
