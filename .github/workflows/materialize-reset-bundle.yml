name: Materialize Reset bundle

on:
  push:
    branches: [feature/seven-day-project-you-reset-v1]
    paths:
      - '.reset-bundle-ready'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/seven-day-project-you-reset-v1
          fetch-depth: 0
      - name: Materialize Reset source
        shell: bash
        run: |
          set -euo pipefail
          test -f .reset-bundle-ready
          ls .reset-part-* >/dev/null
          cat .reset-part-* | base64 --decode > /tmp/project-you-reset.tgz
          tar -xzf /tmp/project-you-reset.tgz
          rm -f .reset-part-* .reset-bundle-ready
          git config user.name "ProjectYouPlus Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build 7-Day Project You+ Reset retention engine"
          git push origin HEAD:feature/seven-day-project-you-reset-v1
